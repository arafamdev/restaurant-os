<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 120"
  width="100%"
  height="100%"
>
  <!-- RestaurantOS mark for dark backgrounds -->

  <g transform="translate(10, 10)">
    <!-- R Stem -->
    <rect
      x="0"
      y="0"
      width="16"
      height="100"
      rx="8"
      fill="#FFFFFF"
    />

    <!-- O -->
    <circle
      cx="50"
      cy="50"
      r="42"
      stroke="#FFFFFF"
      stroke-width="16"
      fill="none"
    />

    <!-- R Leg -->
    <path
      d="M 50,50 L 85,92"
      stroke="#FFFFFF"
      stroke-width="16"
      stroke-linecap="round"
    />

    <!-- Accent -->
    <circle
      cx="50"
      cy="50"
      r="10"
      fill="#10B981"
    />
  </g>
</svg>