<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 500 160"
  width="100%"
  height="100%"
>
  <!-- RestaurantOS logo for light backgrounds -->

  <g transform="translate(40, 30)">
    <!-- Logo Mark -->
    <g>
      <!-- R Stem -->
      <rect
        x="0"
        y="0"
        width="16"
        height="100"
        rx="8"
        fill="#0B0F19"
      />

      <!-- O -->
      <circle
        cx="50"
        cy="50"
        r="42"
        stroke="#0B0F19"
        stroke-width="16"
        fill="none"
      />

      <!-- R Leg -->
      <path
        d="M 50,50 L 85,92"
        stroke="#0B0F19"
        stroke-width="16"
        stroke-linecap="round"
      />

      <!-- Accent -->
      <circle
        cx="50"
        cy="50"
        r="10"
        fill="#10B981"
      />
    </g>

    <!-- Wordmark -->
    <g transform="translate(130, 68)">
      <text
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="42"
        font-weight="800"
        fill="#0B0F19"
        letter-spacing="-0.5"
      >
        Restaurant<tspan
          font-weight="400"
          fill="#4B5563"
        >OS</tspan>
      </text>
    </g>
  </g>
</svg>